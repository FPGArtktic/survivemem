[project]
name = "survivemem"
version = "0.1.0"
description = "Local, single-user persistent memory for Claude Code and Claude Desktop: one SQLite file, FTS5 search, compaction-proof session state and debug investigations."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mateusz Okulanis", email = "FPGArtktic@outlook.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    # MCP server (MCPServer, the 2.x name of FastMCP), stdio; no stdlib implementation. MIT.
    "mcp>=2.0",
    # Ollama embeddings over loopback with timeouts; already pulled in by mcp. BSD-3-Clause.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Vector rerank; FTS5-only search works without it. MIT OR Apache-2.0.
vec = ["sqlite-vec>=0.1.6"]

[project.scripts]
survivemem = "survivemem.entry:main"

[dependency-groups]
# sqlite-vec is optional at runtime; installed for development so the vector path is tested.
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "sqlite-vec>=0.1.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survivemem"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "S110"]
# Rendered output uses typographic "…", "—" and "→" on purpose (spec formats).
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
